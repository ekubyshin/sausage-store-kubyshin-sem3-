apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: {{ .Chart.Name }}
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}
    spec:
      initContainers:
        - name: vault-mongodb-uri
          image: {{ .Values.global.vault.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: "{{ .Values.global.vault.scheme }}://{{ .Values.global.vault.host }}:{{ .Values.global.vault.port }}"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.vault.name }}
                  key: vault_token
          command:
            - /bin/sh
            - -ec
            - |
              vault kv get -field=spring.data.mongodb.uri \
                {{ .Values.global.vault.kvMount }}/{{ .Values.global.vault.secretPath }} \
                > /vault/secrets/db
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              export DB="$(cat /vault/secrets/db)"
              exec ./main
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-{{ .Chart.Name }}-conf
                  key: PORT
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          ports:
            - containerPort: {{ .Values.containerPort }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: vault-secrets
          emptyDir: {}