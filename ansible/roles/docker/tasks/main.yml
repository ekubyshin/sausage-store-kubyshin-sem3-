---
- name: Install packages required to add the Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create the Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the Docker apt key
  ansible.builtin.get_url:
    url: "{{ docker_apt_repo }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_repo }} {{ ansible_distribution_release }} stable

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Use Docker Hub mirrors reachable from the virtual machine
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "registry-mirrors": {{ docker_registry_mirrors | to_json }}
      }
  register: docker_daemon

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Restart Docker to apply the mirror
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon is changed

- name: Allow the SSH user to run Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
